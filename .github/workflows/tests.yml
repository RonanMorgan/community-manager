name: Run Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with pytest
        env:
          PYTHONPATH: .
        run: pytest tests scripts/maintenance backend/tests

  migrations:
    # Guards against the exact regression fixed in this commit: a model
    # change that isn't reflected in an Alembic migration. Runs the
    # migrations against a real Postgres (not SQLite) since that's what
    # docker-compose actually uses, and `alembic check` fails the build if
    # the models and the migration history have drifted apart.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: community_manager
          POSTGRES_PASSWORD: community_manager
          POSTGRES_DB: community_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run alembic migrations
        env:
          DATABASE_URL: postgresql+psycopg2://community_manager:community_manager@localhost:5432/community_manager
        run: alembic upgrade head

      - name: Check for schema drift (models vs. migrations)
        env:
          DATABASE_URL: postgresql+psycopg2://community_manager:community_manager@localhost:5432/community_manager
        run: |
          alembic check
